<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - IES Manifest Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Calibri, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1B4F72 0%, #2E86C1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      text-align: center;
    }

    .company-name {
      font-size: 22px;
      font-weight: 700;
      color: #1B4F72;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .platform-label {
      font-size: 13px;
      font-weight: 600;
      color: #2E86C1;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #555;
      margin-bottom: 16px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .user-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 18px;
      background: #f7f9fc;
      border: 2px solid #e4e9f0;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #1B4F72;
      text-align: left;
      transition: all 0.15s ease;
      min-height: 56px;
    }

    .user-btn:hover {
      background: #eef3fa;
      border-color: #2E86C1;
    }

    .user-btn:active {
      transform: scale(0.98);
    }

    .user-btn.selected {
      background: #eef3fa;
      border-color: #2E86C1;
      box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.15);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2E86C1;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name-text {
      font-size: 16px;
      font-weight: 600;
      color: #1B4F72;
    }

    .user-role {
      font-size: 12px;
      color: #888;
      text-transform: capitalize;
    }

    .pin-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #eee;
    }

    .pin-prompt {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .pin-prompt strong {
      color: #1B4F72;
    }

    .pin-boxes {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pin-input {
      width: 52px;
      height: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #1B4F72;
      border: 2px solid #d0d7e0;
      border-radius: 12px;
      background: #f7f9fc;
      font-family: inherit;
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }

    .pin-input:focus {
      outline: none;
      border-color: #2E86C1;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.15);
    }

    .pin-input::-webkit-outer-spin-button,
    .pin-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #1B4F72;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      min-height: 50px;
    }

    .login-btn:hover {
      background: #154360;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      background: #a3bdd4;
      cursor: not-allowed;
    }

    .error-msg {
      color: #d32f2f;
      font-size: 14px;
      font-weight: 500;
      margin-top: 14px;
      min-height: 20px;
    }

    .lockout-msg {
      color: #e65100;
      font-size: 14px;
      font-weight: 500;
      margin-top: 14px;
      background: #fff3e0;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #ffcc80;
    }

    .loading {
      padding: 40px;
      color: #888;
      font-size: 15px;
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #e4e9f0;
      border-top-color: #2E86C1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .load-error {
      color: #d32f2f;
      font-size: 14px;
      padding: 20px;
    }

    .load-error button {
      margin-top: 12px;
      padding: 8px 20px;
      background: #2E86C1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #2E86C1;
      font-size: 13px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 12px;
      }

      .company-name {
        font-size: 19px;
      }

      .pin-input {
        width: 48px;
        height: 54px;
        font-size: 22px;
      }

      .pin-boxes {
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="company-name">Independence Environmental Services</div>
    <div class="platform-label">Manifest Platform</div>

    <!-- Loading state -->
    <div id="loadingState" class="loading">
      <div class="loading-spinner"></div>
      <div>Loading users...</div>
    </div>

    <!-- Error loading users -->
    <div id="loadError" class="load-error hidden">
      <div>Could not load users.</div>
      <button onclick="loadUsers()">Retry</button>
    </div>

    <!-- User selection list -->
    <div id="userListSection" class="hidden">
      <div class="section-title">Select your name to sign in</div>
      <div id="userList" class="user-list"></div>
    </div>

    <!-- PIN entry section -->
    <div id="pinSection" class="pin-section hidden">
      <div class="pin-prompt">Enter PIN for <strong id="selectedUserName"></strong></div>
      <div class="pin-boxes">
        <input class="pin-input" id="pin0" type="text" inputmode="numeric" maxlength="1" autocomplete="off" />
        <input class="pin-input" id="pin1" type="text" inputmode="numeric" maxlength="1" autocomplete="off" />
        <input class="pin-input" id="pin2" type="text" inputmode="numeric" maxlength="1" autocomplete="off" />
        <input class="pin-input" id="pin3" type="text" inputmode="numeric" maxlength="1" autocomplete="off" />
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()" disabled>Sign In</button>
      <div id="errorMsg" class="error-msg"></div>
      <div id="lockoutMsg" class="lockout-msg hidden"></div>
      <button class="back-link" onclick="goBackToUsers()">Choose a different user</button>
    </div>
  </div>

  <script>
    var selectedUserId = null;
    var selectedUserRole = null;
    var usersLoaded = [];

    function getInitials(name) {
      var parts = name.split(' ');
      var initials = '';
      for (var i = 0; i < parts.length && i < 2; i++) {
        if (parts[i].length > 0) {
          initials += parts[i].charAt(0).toUpperCase();
        }
      }
      return initials || '?';
    }

    function loadUsers() {
      var loadingEl = document.getElementById('loadingState');
      var errorEl = document.getElementById('loadError');
      var listSection = document.getElementById('userListSection');

      loadingEl.className = 'loading';
      errorEl.className = 'load-error hidden';
      listSection.className = 'hidden';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/auth/users', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200) {
          try {
            var users = JSON.parse(xhr.responseText);
            usersLoaded = users;
            renderUserList(users);
            loadingEl.className = 'loading hidden';
            listSection.className = '';
          } catch (e) {
            loadingEl.className = 'loading hidden';
            errorEl.className = 'load-error';
          }
        } else {
          loadingEl.className = 'loading hidden';
          errorEl.className = 'load-error';
        }
      };
      xhr.onerror = function() {
        loadingEl.className = 'loading hidden';
        errorEl.className = 'load-error';
      };
      xhr.send();
    }

    function renderUserList(users) {
      var container = document.getElementById('userList');
      var html = '';
      for (var i = 0; i < users.length; i++) {
        var user = users[i];
        var initials = getInitials(user.name);
        var roleLabel = user.role || 'user';
        html += '<button class="user-btn" data-userid="' + user.id + '" data-username="' + user.name.replace(/"/g, '&quot;') + '" data-userrole="' + roleLabel + '" onclick="selectUser(this)">';
        html += '<div class="user-avatar">' + initials + '</div>';
        html += '<div class="user-info">';
        html += '<span class="user-name-text">' + user.name + '</span>';
        html += '<span class="user-role">' + roleLabel + '</span>';
        html += '</div>';
        html += '</button>';
      }
      container.innerHTML = html;
    }

    function selectUser(btn) {
      selectedUserId = btn.getAttribute('data-userid');
      var userName = btn.getAttribute('data-username');
      selectedUserRole = btn.getAttribute('data-userrole');

      // Highlight selected user
      var allBtns = document.querySelectorAll('.user-btn');
      for (var i = 0; i < allBtns.length; i++) {
        allBtns[i].className = 'user-btn';
      }
      btn.className = 'user-btn selected';

      // Show PIN section
      document.getElementById('selectedUserName').textContent = userName;
      document.getElementById('pinSection').className = 'pin-section';
      clearPin();
      clearErrors();

      // Focus first PIN box
      setTimeout(function() {
        document.getElementById('pin0').focus();
      }, 100);
    }

    function goBackToUsers() {
      selectedUserId = null;
      selectedUserRole = null;
      document.getElementById('pinSection').className = 'pin-section hidden';
      clearPin();
      clearErrors();

      // Remove highlight
      var allBtns = document.querySelectorAll('.user-btn');
      for (var i = 0; i < allBtns.length; i++) {
        allBtns[i].className = 'user-btn';
      }
    }

    function clearPin() {
      for (var i = 0; i < 4; i++) {
        document.getElementById('pin' + i).value = '';
      }
      document.getElementById('loginBtn').disabled = true;
    }

    function clearErrors() {
      document.getElementById('errorMsg').textContent = '';
      document.getElementById('lockoutMsg').className = 'lockout-msg hidden';
      document.getElementById('lockoutMsg').textContent = '';
    }

    function getPin() {
      var pin = '';
      for (var i = 0; i < 4; i++) {
        pin += document.getElementById('pin' + i).value;
      }
      return pin;
    }

    function checkPinComplete() {
      var pin = getPin();
      document.getElementById('loginBtn').disabled = (pin.length !== 4);
    }

    function setupPinInputs() {
      for (var i = 0; i < 4; i++) {
        (function(idx) {
          var input = document.getElementById('pin' + idx);

          input.addEventListener('input', function(e) {
            var val = this.value.replace(/[^0-9]/g, '');
            this.value = val.charAt(0) || '';

            if (val.length > 0 && idx < 3) {
              document.getElementById('pin' + (idx + 1)).focus();
            }
            checkPinComplete();
          });

          input.addEventListener('keydown', function(e) {
            // Backspace: if empty, move to previous
            if (e.key === 'Backspace' && this.value === '' && idx > 0) {
              document.getElementById('pin' + (idx - 1)).focus();
              document.getElementById('pin' + (idx - 1)).value = '';
              checkPinComplete();
            }
            // Enter: submit if complete
            if (e.key === 'Enter') {
              var pin = getPin();
              if (pin.length === 4) {
                doLogin();
              }
            }
          });

          input.addEventListener('focus', function() {
            this.select();
          });

          // Handle paste
          input.addEventListener('paste', function(e) {
            e.preventDefault();
            var pasted = (e.clipboardData || window.clipboardData).getData('text');
            var digits = pasted.replace(/[^0-9]/g, '');
            for (var j = 0; j < 4 && j < digits.length; j++) {
              document.getElementById('pin' + j).value = digits.charAt(j);
            }
            if (digits.length >= 4) {
              document.getElementById('pin3').focus();
            } else if (digits.length > 0) {
              document.getElementById('pin' + Math.min(digits.length, 3)).focus();
            }
            checkPinComplete();
          });
        })(i);
      }
    }

    function doLogin() {
      var pin = getPin();
      if (pin.length !== 4 || !selectedUserId) return;

      clearErrors();
      var loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      var payload = JSON.stringify({ userId: selectedUserId, pin: pin });

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/auth/login', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        loginBtn.textContent = 'Sign In';

        if (xhr.status === 200) {
          try {
            var resp = JSON.parse(xhr.responseText);
            if (resp.success) {
              var role = (resp.user && resp.user.role) ? resp.user.role : selectedUserRole;
              if (role === 'driver') {
                window.location.href = '/scan';
              } else {
                window.location.href = '/';
              }
              return;
            }
          } catch (e) {
            // fall through to error
          }
          document.getElementById('errorMsg').textContent = 'Login failed. Please try again.';
          clearPin();
          document.getElementById('pin0').focus();
        } else if (xhr.status === 429) {
          var msg = 'Too many login attempts. Please try again later.';
          try {
            var errData = JSON.parse(xhr.responseText);
            if (errData.error) msg = errData.error;
          } catch (e) {}
          document.getElementById('lockoutMsg').textContent = msg;
          document.getElementById('lockoutMsg').className = 'lockout-msg';
          clearPin();
        } else if (xhr.status === 401) {
          document.getElementById('errorMsg').textContent = 'Incorrect PIN. Please try again.';
          clearPin();
          document.getElementById('pin0').focus();
        } else {
          document.getElementById('errorMsg').textContent = 'Login failed. Please try again.';
          clearPin();
          document.getElementById('pin0').focus();
        }

        loginBtn.disabled = false;
      };
      xhr.onerror = function() {
        loginBtn.textContent = 'Sign In';
        loginBtn.disabled = false;
        document.getElementById('errorMsg').textContent = 'Network error. Check your connection.';
        clearPin();
      };
      xhr.send(payload);
    }

    // Initialize
    setupPinInputs();
    loadUsers();
  </script>

</body>
</html>
